[project]
name = "muzikk"
version = "0.2.0"
description = "Self-hosted music request and download manager for slskd, torrents, Jellyfin and MusicBrainz"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["muzikk*"]

[tool.ruff]
line-length = 110
target-version = "py312"
# Revision files are generated by Alembic, formatting them adds only noise.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
