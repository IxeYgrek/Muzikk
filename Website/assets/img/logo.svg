    <rect x="5" y="10" width="8" height="46" rx="4" />
    <rect x="17" y="22" width="8" height="34" rx="4" />
    <rect x="29" y="34" width="8" height="22" rx="4" />
    <rect x="41" y="22" width="8" height="34" rx="4" />
    <rect x="53" y="10" width="8" height="46" rx="4" />
  </g>
</svg>
