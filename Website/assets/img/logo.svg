<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Muzikk">
  <defs>
    <linearGradient id="muzikk-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="55%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
  </defs>
  <!-- Monogram M drawn as equalizer bars: the top outline traces the letter. -->
