    <radialGradient id="halo-pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#DB2777" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#DB2777" stop-opacity="0" />
